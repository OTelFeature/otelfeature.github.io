<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">

  <!-- Link previews on LinkedIn, Slack, Bluesky and X -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="OTelFeature – KubeCon NA 2026">
  <meta property="og:description" content="Code, demo and speakers from the Flagsmith × Dash0 talk: controlling OpenTelemetry instrumentation at runtime with OpenFeature.">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/og.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="OTelFeature, a talk by Flagsmith and Dash0 at KubeCon + CloudNativeCon North America 2026">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  {% if site.plausible_domain %}
  <script defer data-domain="{{ site.plausible_domain }}" src="https://plausible.io/js/script.outbound-links.js"></script>
  {% elsif site.goatcounter_code %}
  <script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  {% endif %}
</head>
<body>
  <main>
    {{ content }}
  </main>
  <footer></footer>
</body>
</html>
