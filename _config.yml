title: OTelFeature
description: Controlling OpenTelemetry instrumentation at runtime with OpenFeature and flagd.
url: https://otelfeature.github.io
baseurl: /presentation
markdown: kramdown
exclude:
  - README.md

# Optional blocks. Each one stays hidden while its value is empty.
slides_url:            # the slide deck, ungated
recording_signup_url:  # opt-in form that sends the recording (consent per company)
session_url:           # the session's page on the event schedule, for feedback
booths:
  flagsmith:           # e.g. "Booth S12"
  dash0:
# Cookie-less analytics, no consent banner needed. Set one of them.
plausible_domain:      # e.g. otelfeature.github.io
goatcounter_code:      # e.g. otelfeature → otelfeature.goatcounter.com
